name: CI

on:
  pull_request:
  push:
    branches: ['**']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm install --global @earendil-works/pi-coding-agent@1.1.0
      - run: npm run smoke
      - run: npm run eval:acp
